name: Validate static data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4==4.13.4
      - run: python3 -m unittest discover -s tests -v
      - run: node --check scripts/explorer.js && node --check scripts/reader.js && node --check tests/browser_smoke.cjs
      - run: node --check scripts/results.js && node tests/test_results.cjs
      - run: python3 scripts/build_party_summary.py --check
      - run: python3 scripts/audit_coverage.py
      - run: git diff --exit-code -- index.html
