name: Generate public bulletin facts for review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/derive_bulletin.py'
      - '.github/workflows/derive-bulletin.yml'
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4==4.13.4
      - name: Stage source and generate restricted public data
        run: |
          python3 scripts/stage_bulletin.py --output "$RUNNER_TEMP/bulletin-review.json"
          python3 scripts/derive_bulletin.py "$RUNNER_TEMP/bulletin-review.json" "$RUNNER_TEMP/bulletin-exact-facts.json"
          python3 -c 'import json,sys; from pathlib import Path; old=json.loads(Path("data/bulletin-facts.json").read_text())["records"]; exact=json.loads(Path(sys.argv[1]).read_text())["records"]; assert len(exact)>=1414 and all(old.get(k)==v for k,v in exact.items()), "exact-pass regression"; print("Exact-pass subset verified:",len(exact))' "$RUNNER_TEMP/bulletin-exact-facts.json"
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: bulletin-exact-facts-review
          path: ${{ runner.temp }}/bulletin-exact-facts.json
          retention-days: 7
