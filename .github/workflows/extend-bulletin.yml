name: Generate bulletin detail supplement
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/extend_bulletin.py'
      - '.github/workflows/extend-bulletin.yml'
permissions:
  contents: write
jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/extend_bulletin.py
      - run: python3 -m unittest discover -s tests -v
      - name: Stage generated data on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "bulletin-details-${GITHUB_RUN_ID}"
          git add data/bulletin-facts.json data/bulletin-details.json
          git commit -m 'Generate bulletin detail supplement'
          git push origin HEAD
