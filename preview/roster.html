<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CivicLens 公民鏡｜名冊開發預覽</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f5;color:#182b36;font:16px/1.65 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}main,header>div{max-width:920px;margin:auto;padding:24px}header{border-bottom:1px solid #d8dfe0;background:white}a{color:#304f60;text-underline-offset:4px}h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:14px 0}h2{font-size:21px}p{margin:8px 0 16px}.sub{color:#526571;font-size:14px}.notice{border:1px solid #d2b88b;border-left:4px solid #a06d25;background:#fffdf7;padding:16px;border-radius:9px;margin:22px 0}.controls{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px}label{display:block;font-weight:650;margin-bottom:5px}input,button{font:inherit;min-height:48px;border:1px solid #aab8bf;border-radius:8px;padding:8px 12px;background:#fff;color:inherit;width:100%}button{cursor:pointer;font-weight:650}button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #a85d13;outline-offset:3px}.row{background:white;border:1px solid #d8dfe0;border-radius:12px;padding:16px;margin:12px 0;display:grid;grid-template-columns:52px 1fr;gap:14px}.number{height:48px;width:48px;display:grid;place-items:center;border:1px solid #d8dfe0;border-radius:8px;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}.name{font-size:21px;font-weight:700;margin:0}.party{margin:4px 0 12px}.evidence{font-size:14px}.evidence a{display:inline-flex;align-items:center;min-height:44px;margin-right:16px}summary{cursor:pointer;font-weight:650}#count{margin-top:16px}footer{color:#526571;font-size:14px;padding-top:18px;border-top:1px solid #d8dfe0;margin-top:32px}.skip{position:absolute;top:-100px}.skip:focus{top:4px;background:#fff;padding:10px} [hidden]{display:none!important}@media(max-width:450px){main,header>div{padding:16px}.controls{grid-template-columns:1fr}.row{padding:12px;grid-template-columns:44px 1fr;gap:10px}.number{width:40px;height:44px}}
</style></head><body><a class="skip" href="#main">跳至主要內容</a><header><div><strong>CivicLens 公民鏡</strong> <span class="sub">V0.2.0-alpha.1｜開發預覽</span></div></header><main id="main"><p class="sub">2026 地方公職人員選舉 / 名冊測試</p><h1>候選人名冊</h1><div class="notice"><strong>非正式發布版本</strong><p>目前只測試臺北市市長一個完整選區，6 筆名冊資料已核對官方影像，尚未完成獨立人工覆核。其餘縣市及職務未匯入，不能解讀為沒有候選人。全國 19,100 人為中選會資格審定統計，非投票日最終名冊。</p></div><h2>臺北市 · 直轄市長</h2><p class="sub">依公告號次排序。推薦政黨為官方 10 月 27 日名冊原文，不等於現時黨籍；「無」表示未受政黨推薦。</p><div class="controls"><div><label for="q">搜尋姓名或號次</label><input type="search" id="q" placeholder="輸入姓名或號次" autocomplete="off" disabled></div><button type="button" id="reset" disabled>清除搜尋</button></div><p id="count" role="status" aria-live="polite">讀取資料中…</p><div id="list"></div><p><a href="https://eebulletin.cec.gov.tw/?dir=115">其他選區：官方電子公報 ↗</a></p><noscript><p>此開發預覽需要 JavaScript，請查閱官方公報。</p></noscript><footer><a href="../docs/ROSTER-AUDIT.md">查核方法與發布門檻</a> · <a href="../data/roster-pilot.json">資料快照</a> · 非政府官方網站</footer></main><script>
"use strict";
const q=document.getElementById("q"),reset=document.getElementById("reset"),count=document.getElementById("count"),list=document.getElementById("list");
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function sourceLink(url,label){const u=new URL(url);if(u.protocol!=="https:"||!["web.cec.gov.tw","www.cec.gov.tw"].includes(u.hostname))throw new Error("Unexpected source");const a=element("a",label);a.href=u.href;a.target="_blank";a.rel="noopener noreferrer";return a}
function render(records){const term=q.value.trim();const matched=records.filter(r=>!term||r.fields.name.value.includes(term)||String(r.ballot_number)===term);list.replaceChildren();for(const r of matched){const row=element("article",undefined,"row");row.append(element("div",String(r.ballot_number)+"號","number"));const body=element("div");body.append(element("h3",r.fields.name.value,"name"),element("p","推薦之政黨："+r.fields.party.value,"party"));const details=element("details",undefined,"evidence");details.append(element("summary","資料來源及日期"));const links=element("p");links.append(sourceLink(r.fields.name.evidence[0].url,"11/12 正式名單"),sourceLink(r.fields.party.evidence[0].url,"10/27 號次及推薦政黨"));details.append(links,element("p","2026-11-25（臺灣時間）影像交叉核對；獨立人工覆核待完成。"));body.append(details);row.append(body);list.append(row)}count.textContent="顯示 "+matched.length+" / "+records.length+" 筆（單一選區）";if(!matched.length)list.append(element("p","沒有符合搜尋的名冊資料。"))}
fetch("../data/roster-pilot.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(d=>{if(d.release_status!=="blocked_pending_independent_review"||d.expected_count!==6||d.records.length!==6||d.records.some((r,i)=>r.ballot_number!==i+1||r.jurisdiction_code!=="01"||r.district_id!=="01-citywide"||r.fields.name.status!=="verified"||r.fields.party.status!=="verified"))throw new Error("Invalid pilot");render(d.records);q.disabled=false;reset.disabled=false;q.addEventListener("input",()=>render(d.records));reset.addEventListener("click",()=>{q.value="";render(d.records);q.focus()})}).catch(()=>{list.replaceChildren();count.textContent="資料讀取或驗證失敗，請改用官方公報。";q.disabled=true;reset.disabled=true});
</script></body></html>
