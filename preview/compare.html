<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>候選人比較｜開發覆核版</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#20343e;background:#f6f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:16px}header{border-bottom:1px solid #d8dfdc;padding:12px 0;margin-bottom:16px}h1{font-size:23px;margin:0}p{line-height:1.6}small{color:#54656a}.notice{background:#fff4d9;border:1px solid #c9a969;padding:10px;border-radius:8px;font-size:14px}label{display:block;font-weight:600;font-size:14px}select,input[type=search],button{font:inherit;min-height:44px;border:1px solid #b7c2bf;border-radius:8px;background:white;color:inherit;padding:8px;max-width:100%}select,input[type=search]{width:100%;margin-top:4px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.entry{display:flex;align-items:center;gap:10px;background:white;border:1px solid #d7dfdc;border-radius:8px;padding:10px;margin:6px 0;min-height:48px}.entry input{width:20px;height:20px;flex:none}.entry strong{font-size:17px}.entry span{margin-left:auto;text-align:right;font-size:13px}.toolbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:10px 0}.tablewrap{overflow:auto;border:1px solid #d7dfdc;border-radius:8px;background:white}table{border-collapse:collapse;width:100%;min-width:460px}td,th{text-align:left;border-bottom:1px solid #d7dfdc;padding:12px;vertical-align:top;font-size:14px}th{background:#eef2ef}tbody th{width:90px}a{color:#204e66}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #608aab;outline-offset:2px}@media(max-width:450px){main{padding:12px}.controls{grid-template-columns:1fr}.entry span{max-width:48%}}
.candidate-row{display:flex;align-items:center;gap:8px}.candidate-row .entry{flex:1;min-width:0}.profile-link{display:inline-flex;align-items:center;min-height:44px;font-size:13px;white-space:nowrap}.controls select{font-size:16px}.entry strong{overflow-wrap:anywhere;min-width:0}</style></head><body><main><header><h1>候選人比較</h1><small>11.28｜115年地方公職人員選舉</small></header><p class="notice">開發覆核版 · 資料尚未獨立覆核，不得作為正式名冊。僅比較同選舉區；無評分及推薦。</p><div class="controls"><label>縣市／職務／選區<select id="district"></select></label><label>搜尋姓名或號次<input type="search" id="query" placeholder="例如：1"></label></div><p id="coverage" role="status"></p><div id="list"></div><div class="toolbar"><strong id="selection" aria-live="polite"></strong><button type="button" id="clear">清除比較</button></div><div class="tablewrap" tabindex="0" aria-label="候選人比較表"><table id="compare"></table></div><p><a id="gazette" target="_blank" rel="noopener noreferrer">官方公報目錄 ↗</a> · <a id="notice" target="_blank" rel="noopener noreferrer">正式公告 ↗</a></p><small>「無」表示來源所列無推薦政黨；「登記」為9/7階段資料。學經歷及政見是候選人自述摘要，非獨立認證；「尚未整理」不代表沒有相關資訊。選取紀錄不保存、不上傳。</small></main><script src="compare.js" defer></script></body></html>
